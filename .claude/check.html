<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .g { display: grid; grid-template-columns: repeat(6, 120px); gap: 10px; padding: 10px; }
  .photo::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to right, transparent calc(50% - .5px), red calc(50% - .5px), red calc(50% + .5px), transparent 0),
                linear-gradient(to bottom, transparent calc(40% - .5px), red calc(40% - .5px), red calc(40% + .5px), transparent 0); }
  p { margin: 4px 0 0; font-size: 11px; }
</style>
<div class="g" id="g"></div>
<script src="../assets/data.js"></script>
<script src="../assets/common.js"></script>
<script>
  g.innerHTML = MASTERS.map(m => `<div>${photoHTML(m, { eager: true })}<p>${m.name}</p></div>`).join('');
  fitAll(g);
</script>
