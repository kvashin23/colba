<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мастер — ColBa Color Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/pages.css">
</head>
<body>
  <header class="site-header"></header>

  <main class="page" id="app"></main>

  <footer class="site-footer"></footer>
  <script src="assets/layout.js"></script>

  <script src="assets/data.js"></script>
  <script src="assets/data/services.js"></script>
  <script src="assets/data/masters.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const id = +new URLSearchParams(location.search).get('id');
    const base = MASTERS.find(x => x.id === id) || MASTERS[0];
    // Полные данные со страницы мастера на сайте (assets/data/masters.js)
    const d = (typeof MASTER_DETAILS !== 'undefined' && MASTER_DETAILS[base.id]) || {};
    const m = {
      ...base,
      bio: base.bio?.length ? base.bio : d.bio || [],
      works: base.works?.length ? base.works : (d.works || []).map(UI.img),
      reviews: d.reviews?.length ? d.reviews : base.reviews || [],
      reviewsCount: Math.max(d.reviewsCount || 0, d.reviews?.length || 0, base.reviewsCount || 0),
      videos: d.videos || [],
    };
    document.title = `${m.name} — ${m.role.toLowerCase()} в ColBa Color Bar`;
    const { e, arrows } = UI;
    const isQuote = p => /^«.*»\.?$/.test(p);
    const others = [...MASTERS.filter(x => x.id !== m.id && x.cat === m.cat), ...MASTERS.filter(x => x.cat !== m.cat)];
    const book = `href="#book" data-book data-master="${m.id}"`;

    document.getElementById('app').innerHTML = `
      ${UI.crumbs([['Команда', 'teams.html'], [CATEGORIES[m.cat], `teams.html?cat=${m.cat}`], [m.name]])}

      <section class="master-hero">
        <div class="master-hero__photo">
          ${photoHTML(m, { eager: true })}
          ${m.reviewsCount ? `
            <a class="master-hero__badge" href="#reviews">
              <b>${ICON_STAR} ${(m.rating || 5).toFixed(1)}</b>
              ${m.reviewsCount} ${plural(m.reviewsCount, 'отзыв', 'отзыва', 'отзывов')}
            </a>` : ''}
        </div>
        <div class="master-hero__info">
          <h1 class="master-hero__name">${e(m.name)}</h1>
          <div class="master-hero__actions">
            <a class="btn" ${book}>Записаться к мастеру</a>
            ${m.works.length ? '<a class="btn btn--ghost" href="#works-h">Смотреть работы</a>' : ''}
          </div>
          ${m.bio.length ? `
          <div class="about__text">
            ${m.bio.map(p => isQuote(p) ? `<p class="about__quote">${e(p)}</p>` : `<p>${e(p)}</p>`).join('')}
          </div>` : ''}
        </div>
      </section>

      ${m.works.length ? `
      <section class="section" aria-labelledby="works-h">
        <div class="section__head">
          <div><h2 class="h-section" id="works-h">Работы мастера</h2><p>Реальные результаты клиентов салона</p></div>
        </div>
        <div class="rail works" id="works">
          ${m.works.map((src, i) => `<a href="${e(src)}" data-lightbox="works"><img src="${e(src)}" alt="Работа мастера ${i + 1}" loading="lazy"></a>`).join('')}
        </div>
        ${arrows('works')}
      </section>` : ''}

      ${m.videos.length ? `
      <section class="section" aria-labelledby="video-h">
        <div class="section__head"><h2 class="h-section" id="video-h">Видео</h2></div>
        <div class="photo-grid photo-grid--video" style="--cols:4">${m.videos.map(v => `<a class="video-tile" href="https://www.youtube.com/watch?v=${v}" data-video="${v}" data-group="mv"><img src="https://i.ytimg.com/vi_webp/${v}/maxresdefault.webp" alt="Видео" loading="lazy"></a>`).join('')}</div>
      </section>` : ''}

      <section class="section" id="reviews" aria-labelledby="reviews-h">
        <div class="section__head">
          <div><h2 class="h-section" id="reviews-h">Отзывы</h2>
            <p>${m.reviewsCount ? `${m.reviewsCount} ${plural(m.reviewsCount, 'отзыв', 'отзыва', 'отзывов')} · средняя оценка ${(m.rating || 5).toFixed(1)}` : 'Будьте первым, кто оставит отзыв'}</p></div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            ${m.reviews.length ? `<a class="link-more" href="reviews.html?master=${m.id}">Все отзывы</a>` : ''}
            <button class="link-more" type="button" data-review="${m.id}" style="background:none;border:0;border-bottom:1px solid;cursor:pointer;padding:0 0 2px">Оставить отзыв</button>
          </div>
        </div>
        ${m.reviews.length ? `
        <div class="rail reviews" id="reviewsRail">
          ${m.reviews.map(r => `
            <article class="review">
              <header><h3>${e(r.author)}</h3>${starsHTML(r.rating || 5)}</header>
              <p>${e(r.text)}</p>
              <time>${e(r.date)}</time>
            </article>`).join('')}
        </div>
        ${arrows('reviewsRail')}` : ''}
      </section>

      <section class="cta">
        <h2>${e(m.name)}<br><em>ждёт вас в ColBa</em> — подберём удобное время</h2>
        <a class="btn" ${book}>Записаться</a>
      </section>

      <section class="section" aria-labelledby="others-h">
        <div class="section__head"><h2 class="h-section" id="others-h">Другие мастера</h2></div>
        <div class="rail others" id="othersRail">${others.map(cardHTML).join('')}</div>
        ${arrows('othersRail')}
      </section>`;

    fitAll(document);
    UI.initRails(document);
  </script>
</body>
</html>
